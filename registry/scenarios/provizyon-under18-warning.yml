id: provizyon-under18-warning
title: An under-18 provision succeeds with a mandatory warning (9000)
method: medula.hastane.hasta-kabul.hasta-kabul
given:
  facility: SYNTHETIC_FACILITY_001
request:
  saglikTesisKodu: 1
  hastaTCKimlikNo: SYNTHETIC_TC_000000001
  provizyonTipi: N
  tedaviTuru: A
  takipTipi: N
  bransKodu: 1
  doktorTescilNo: SYNTHETIC_DOCTOR_001
  ktsHbysKodu: SYNTHETIC_HBYS_001
expected:
  result:
    sonucKodu: "9000"
    sonucMesaji: >-
      Provizyon sorgulamasını yaptığınız çocuğun ana yada babasına ait TC
      kimlik numarası adı, soyadı, ve ikametgah adresi bilgileri ile GSS
      tescili için mahalinizdeki SGK İl/Merkez Müdürlüğüne başvurması için
      yönlendiriniz!
  stateChanges:
    creates:
      - hastaBasvuruNo
      - takipNo
      - patientAdmission
      - takip
    note: >-
      9000 is NOT an error (s.103): the provision succeeds and takipNo is
      still returned; sonucMesaji must be displayed as a warning and the
      patient directed as stated (s.143). The request models an under-18
      provision — age is not representable with a synthetic TC, so the
      branch is exercised via scenario replay.
