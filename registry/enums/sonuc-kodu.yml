id: sonuc-kodu
displayName: Sonuc Kodu
values:
  - code: "0000"
    label: Islem Basarili
    description: >-
      The operation completed successfully. Documented as a String of
      length 4 in every response table (Tablo 4.1.1.b, 4.1.2.b, 4.1.3.b,
      4.2.1.b, 4.2.3.b, 4.3.1.b, 4.3.2.b, 4.3.3.b).
  - code: "9000"
    label: Uyari Mesaji ile Basarili
    description: >-
      NOT an error: the operation completed successfully and sonucMesaji
      carries a warning that must be shown to the user (guide s.103).
      Documented verbatim for under-18 provision requests (s.143): the
      provision succeeds and takipNo is still returned; the message must
      be displayed as a warning and the patient directed as stated.
