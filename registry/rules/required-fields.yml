rules:
  - id: required-provizyon-giris-fields
    type: required-field
    appliesTo:
      service: medula.hastane.hasta-kabul
      method: medula.hastane.hasta-kabul.hasta-kabul
      dvo: ProvizyonGirisDVO
      field: null
    condition: null
    assertion: >-
      saglikTesisKodu, hastaTCKimlikNo, provizyonTipi, tedaviTuru, takipTipi
      and bransKodu are mandatory for hasta-kabul; the sandbox must reject a
      request missing any of them with a validation error.
    severity: error
    sourceRefs:
      - id: medula-hastane-guide-2026-06-17
        sourceType: official-guide
        guideVersion: "2026-06-17"
        confidence: extracted
    status: draft

  - id: required-hizmet-kayit-giris-fields
    type: required-field
    appliesTo:
      service: medula.hastane.hizmet-kayit
      method: medula.hastane.hizmet-kayit.hizmet-kayit
      dvo: HizmetKayitGirisDVO
      field: null
    condition: null
    assertion: >-
      saglikTesisKodu, hastaBasvuruNo, takipNo, taniBilgileri, islemBilgileri
      and hizmetDetaylari are mandatory for hizmet-kayit.
    severity: error
    sourceRefs:
      - id: medula-hastane-guide-2026-06-17
        sourceType: official-guide
        guideVersion: "2026-06-17"
        confidence: extracted
    status: draft

  - id: required-fatura-giris-fields
    type: required-field
    appliesTo:
      service: medula.hastane.fatura-kayit
      method: medula.hastane.fatura-kayit.fatura-kayit
      dvo: FaturaGirisDVO
      field: null
    condition: null
    assertion: >-
      saglikTesisKodu, faturaTarihi, hastaBasvuruNo, faturaRefNo and
      hizmetDetaylari are mandatory for fatura-kayit.
    severity: error
    sourceRefs:
      - id: medula-hastane-guide-2026-06-17
        sourceType: official-guide
        guideVersion: "2026-06-17"
        confidence: extracted
    status: draft
