rules:
  - id: takip-ara-window-limit
    type: yardimci-rule
    appliesTo:
      service: medula.hastane.yardimci-islemler
      method: medula.hastane.yardimci-islemler.takip-ara
      dvo: TakipAraGirisDVO
      field: bitisTarihi
    condition: the search window between baslangicTarihi and bitisTarihi exceeds one month
    assertion: >-
      takip-ara must return a non-success result when the date window spans
      more than one month (s.286).
    severity: error
    sourceRefs:
      - id: medula-hastane-guide-3-1-1-2026-10-19
        sourceType: official-guide
        guideVersion: "3.1.1"
        page: 286
        confidence: extracted
        notes: >-
          Guide verbatim: "başlangış ve bitiş tarih aralığı 1 ay dan fazla
          olamaz."
      - id: sandbox-design-v0.1
        sourceType: sandbox-design
        confidence: unknown
        notes: SANDBOX_4002 is a sandbox-only code for the window rejection; the guide states the limit but not the error code.
    status: draft
