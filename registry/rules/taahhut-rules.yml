rules:
  - id: taahhut-dis-annex7-restriction
    type: taahhut-rule
    appliesTo:
      service: medula.hastane.taahhut
      method: medula.hastane.taahhut.dis-taahhut-kaydet
      dvo: TaahhutDisDVO
      field: sutKodu
    condition: any taahhutDiss entry carries a SUT code outside the annex-7 prosthesis list
    assertion: >-
      a dental commitment may only be registered for the annex-7 prosthesis
      codes (404010, 404020, 404030, 404040, 404050, 404170, 404180, 404181,
      404190, 404200, 404201, 404210, 404220, 404230, 404360, 404370, 404380,
      404390, 404400, 404410, 404420); a commit carrying any other code must
      return a non-success result and create no taahhut state (s.326).
    severity: error
    sourceRefs:
      - id: medula-hastane-guide-3-1-1-2026-10-19
        sourceType: official-guide
        guideVersion: "3.1.1"
        page: 326
        confidence: extracted
        notes: >-
          Guide verbatim: "Diş taahhütü sadece ağız protez işlemleri için
          gönderilebilecektir. SUT ek 7 listesinden protez kodları; ... bu
          kodlar dışında taahhüt girişi yapılamaz."
      - id: sandbox-design-v0.1
        sourceType: sandbox-design
        confidence: unknown
        notes: SANDBOX_4001 is a sandbox-only code chosen for the annex-7 rejection; the guide states the restriction but not the error code.
    status: draft

  - id: taahhut-ilce-province-mismatch
    type: taahhut-rule
    appliesTo:
      service: medula.hastane.taahhut
      method: medula.hastane.taahhut.dis-taahhut-kaydet
      dvo: TaahhutDVO
      field: adressIlce
    condition: the district name does not match any district of the plate-coded province
    assertion: >-
      the commitment must not be registered when adressIlce does not belong
      to the province given by adressIlPlaka (s.323).
    severity: error
    sourceRefs:
      - id: medula-hastane-guide-3-1-1-2026-10-19
        sourceType: official-guide
        guideVersion: "3.1.1"
        page: 323
        confidence: extracted
        notes: >-
          Guide verbatim: "İlçe adının doğru yazılması önemlidir. İlçe adı
          plaka kodu verilen ilin herhangibir ilçesi ile eşleşmez ise kayıt
          yapılamaz." The sandbox cannot verify real district data; consumers
          apply the check against their own district table.
    status: draft
